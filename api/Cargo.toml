[package]
name = "itsm-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "tracing", "macros", "matched-path"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "fs", "io-util", "sync"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "request-id", "timeout", "limit", "set-header", "sensitive-headers"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "macros", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
getrandom = "0.3"
sha2 = "0.10"
subtle = "2.6"
base64 = "0.22"
http-body-util = "0.1"
rust_xlsxwriter = { version = "0.102", default-features = false }

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
regex = "1"
argon2 = { version = "0.5", features = ["std"] }
aes-gcm = "0.10"
hmac = "0.12"
sha1 = "0.10"
zeroize = "1"

[dev-dependencies]
calamine = { version = "0.30", default-features = false, features = ["dates"] }
