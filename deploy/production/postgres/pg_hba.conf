# ITSM production pg_hba (CP8). First match wins; anything not listed is rejected.
# TYPE  DATABASE     USER                    ADDRESS   METHOD
# Superuser only over the container's own socket (docker compose exec postgres psql).
local   all          postgres                          peer
# Application roles from the backend network only, password (SCRAM). The api/worker run as
# itsm_app; one-off `migrate` / `init-password` as itsm_migrator.
host    itsm         itsm_app,itsm_migrator  samenet   scram-sha-256
# Physical base backups (backup service).
host    replication  itsm_backup             samenet   scram-sha-256
local   all          all                               reject
host    all          all                     all       reject
host    replication  all                     all       reject
