# ITSM production Postgres (CP8). Loaded with `-c config_file=/etc/itsm/postgres/postgresql.conf`;
# the data directory keeps no configuration of its own besides postgresql.auto.conf.
listen_addresses = '*'
port = 5432
hba_file = '/etc/itsm/postgres/pg_hba.conf'

# Connections: 2 API replicas x 10 + worker 4 + migrate 1 + backup 2, see roles.sql limits and
# deploy/RUNBOOK-scaling.md. superuser_reserved_connections keeps room for the operator.
max_connections = 100
superuser_reserved_connections = 3
password_encryption = scram-sha-256

shared_buffers = 512MB
effective_cache_size = 1536MB
work_mem = 8MB
maintenance_work_mem = 128MB

# WAL archive for point-in-time recovery: every completed segment is encrypted to the backup
# volume with the operator's age public key (deploy/production/backup/wal-archive.sh). The server
# never holds the private key. archive_timeout bounds data loss on a quiet system (RPO 5 min).
wal_level = replica
archive_mode = on
archive_command = '/usr/local/lib/itsm/backup/wal-archive.sh %p %f'
archive_timeout = 300
max_wal_senders = 3
wal_keep_size = 1GB
max_wal_size = 2GB

# Logging to stderr (docker logs). Statements are not logged (they could carry personal data);
# failures, slow statements, connections and lock waits are.
log_destination = 'stderr'
log_min_messages = warning
log_min_error_statement = error
log_min_duration_statement = 2000
log_connections = 'authentication'
log_disconnections = on
log_lock_waits = on
log_line_prefix = '%m [%p] %q%u@%d '
log_statement = 'none'

timezone = 'UTC'
log_timezone = 'UTC'
