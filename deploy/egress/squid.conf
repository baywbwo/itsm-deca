# ITSM egress proxy (CP6b): HTTP CONNECT to allowlisted hosts on 443, nothing else.
# No TLS inspection (no ssl_bump), no cache, no header/body/query in logs.
# /run/squid/runtime.conf is written by entrypoint.sh (client CIDRs + DNS resolvers).

http_port 3128
pid_filename none
coredump_dir /tmp
cache deny all
cache_mem 0 MB
memory_pools off
pinger_enable off
shutdown_lifetime 3 seconds
via off
forwarded_for delete
httpd_suppress_version_string on

include /run/squid/runtime.conf

# Clients: only api/worker. Source subnet first, then proxy credentials (basic auth over the
# internal network; the password file holds hashes only).
auth_param basic program /usr/lib/squid/basic_ncsa_auth /run/secrets/egress_proxy_htpasswd
auth_param basic children 2 startup=1 idle=1
auth_param basic realm itsm-egress
auth_param basic credentialsttl 1 hour
acl itsm_users proxy_auth REQUIRED

acl CONNECT method CONNECT
acl tls_port port 443
acl allowed_hosts dstdom_regex -n -i "/etc/squid/itsm/allowlist.regex"
acl ip_literal dstdom_regex -n ^\[?[0-9a-f:.]+\]?$
# Checked AFTER DNS resolution (anti-rebinding: the app does not pin addresses through the
# proxy). Same ranges as providers.rs is_public(), CP5B-07 included. Squid keeps IPv4 as
# IPv4-mapped IPv6, so the v4 ranges also cover ::ffff:a.b.c.d; :: and the deprecated ::a.b.c.d
# form cannot be listed without swallowing 0.0.0.0/0 and are not routable anyway.
acl blocked_dst dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12
acl blocked_dst dst 192.0.0.0/24 192.0.2.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24
acl blocked_dst dst 203.0.113.0/24 224.0.0.0/3
acl blocked_dst dst ::1/128 64:ff9b::/96 64:ff9b:1::/48 100::/64
acl blocked_dst dst 2001::/32 2001:db8::/32 2002::/16 fc00::/7 fe80::/10 fec0::/10 ff00::/8
acl too_many maxconn 200

http_access deny !itsm_clients
http_access deny !itsm_users
http_access deny !CONNECT
http_access deny !tls_port
http_access deny ip_literal
http_access deny !allowed_hosts
http_access deny blocked_dst
http_access deny too_many
http_access allow CONNECT
http_access deny all

connect_timeout 10 seconds
read_timeout 60 seconds
client_idle_pconn_timeout 60 seconds
request_header_max_size 16 KB
max_filedescriptors 1024

# One JSON line per request. Host and port only (CONNECT carries no path, query or headers;
# plain-HTTP requests are denied and their path is not logged either). No user name.
logformat itsm {"ts":"%{%Y-%m-%dT%H:%M:%S%z}tl","src":"%>a","method":"%rm","host":"%#>rd","port":"%>rP","status":%>Hs,"result":"%Ss","bytes_up":%>st,"bytes_down":%<st,"ms":%tr}
access_log stdio:/dev/stdout itsm
cache_log /dev/stderr
cache_store_log none
logfile_rotate 0
