# ITSM UAT (dummy data only). Not for production: ITSM_ENV=uat + uat_superadmin, and the API
# refuses to serve a database that is not marked as the UAT dummy DB.
#
# Fails to start on purpose until the operator configures the ingress restriction:
#   - ITSM_UAT_SITE_ADDRESS, ITSM_UAT_TLS, ITSM_UAT_ALLOWED_CIDRS, ITSM_UAT_BASIC_AUTH_USER in .env
#   - secrets/ingress_basic_auth_hash (bcrypt) and secrets/pg_password
# See README.md. Only the ingress publishes ports; API, Postgres and clamd stay private.
# CP6b: the backend network has no route out. Outbound calls (Jira/Lark, company IdPs) leave only
# through egress-proxy: CONNECT to allowlisted hosts on 443 with proxy credentials
# (deploy/RUNBOOK-egress.md). Needs secrets/egress_proxy_auth + secrets/egress_proxy_htpasswd.
#
# D13: attachments are out of scope. clamd is NOT started by default and is not a startup
# dependency; without ITSM_CLAMD_ADDR every upload is refused fail-closed (503
# scanner_unavailable, nothing stored as clean). Re-enable only together with the feature:
#   ITSM_CLAMD_ADDR=tcp://clamav:3310 docker compose --profile attachments ...
name: itsm-uat

x-ingress-required: &ingress-required
  ITSM_UAT_SITE_ADDRESS: ${ITSM_UAT_SITE_ADDRESS:?ITSM_UAT_SITE_ADDRESS wajib (hostname UAT)}
  ITSM_UAT_TLS: ${ITSM_UAT_TLS:?ITSM_UAT_TLS wajib (internal atau e-mail ACME)}
  ITSM_UAT_ALLOWED_CIDRS: ${ITSM_UAT_ALLOWED_CIDRS:?ITSM_UAT_ALLOWED_CIDRS wajib; akses terbuka ditolak}
  ITSM_UAT_BASIC_AUTH_USER: ${ITSM_UAT_BASIC_AUTH_USER:?ITSM_UAT_BASIC_AUTH_USER wajib}

services:
  postgres:
    image: postgres:18.4-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382
    environment:
      POSTGRES_DB: itsm_uat_dummy
      POSTGRES_USER: itsm
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    secrets: [pg_password]
    volumes:
      - pgdata:/var/lib/postgresql
    networks: [backend]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "itsm", "-d", "itsm_uat_dummy"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped
    shm_size: 256m

  clamav:
    # Optional (profile `attachments`, off by default). Official ClamAV image; clamd on 3310, signatures persisted. Needs egress for freshclam
    # (clamav-updates network) and ~3 GB RAM. First start can take several minutes.
    image: clamav/clamav:1.5.4@sha256:bda39705e291105049c3936e2803ac90b955172af8030f94f05dce1252df6c6d
    profiles: [attachments]
    volumes:
      - clamav-db:/var/lib/clamav
    networks: [backend, clamav-updates]
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 15m
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: deploy/uat/Dockerfile
      target: api
    image: itsm-uat-api:${ITSM_UAT_IMAGE_TAG:?ITSM_UAT_IMAGE_TAG wajib (git SHA kandidat)}
    environment: &api-env
      ITSM_ENV: uat
      ITSM_ACCESS_MODE: uat_superadmin
      ITSM_COOKIE_SECURE: "true"
      ITSM_DB_HOST: postgres
      ITSM_DB_NAME: itsm_uat_dummy
      ITSM_DB_USER: itsm
      # Empty by default = attachment uploads refused (fail-closed). Never a startup dependency.
      ITSM_CLAMD_ADDR: "${ITSM_CLAMD_ADDR:-}"
      ITSM_TRUSTED_PROXIES: ${ITSM_UAT_INGRESS_IP:-172.30.57.10}
      # CP7b: the outbox worker runs in the separate `worker` service. Set on only to run without it.
      ITSM_OUTBOX_WORKER: ${ITSM_OUTBOX_WORKER:-off}
      # Pool per process (CP7b): replicas × size, api and workers together, must stay below the
      # Postgres max_connections (default 100) minus a reserve. deploy/RUNBOOK-scaling.md.
      ITSM_DB_MAX_CONNECTIONS: "${ITSM_DB_MAX_CONNECTIONS:-10}"
      ITSM_DB_ACQUIRE_TIMEOUT_MS: "${ITSM_DB_ACQUIRE_TIMEOUT_MS:-3000}"
      # Prometheus metrics (CP7a) on a separate listener: backend network only, no published port,
      # never forwarded by the ingress (Caddy proxies /api and /health). Scrape api:9464/metrics.
      ITSM_METRICS_BIND: "${ITSM_METRICS_BIND:-0.0.0.0:9464}"
      # Jira/Lark (CP5b). Empty = API default: simulation in UAT. live needs the keyring below.
      ITSM_INTEGRATIONS: "${ITSM_INTEGRATIONS:-}"
      ITSM_INTEGRATIONS_LAB: "${ITSM_INTEGRATIONS_LAB:-}"
      ITSM_INTEGRATIONS_TIMEOUT_MS: "${ITSM_INTEGRATIONS_TIMEOUT_MS:-}"
      # Encrypts stored provider credentials (and TOTP seeds when ITSM_MFA=on). CP5B-04: the key
      # material is a secret file (empty file = no keyring), never an env var visible to inspect.
      ITSM_KEYRING_FILE: /run/secrets/itsm_keyring
      ITSM_KEYRING_ACTIVE: "${ITSM_KEYRING_ACTIVE:-}"
      # CP6b: every outbound call is a CONNECT through egress-proxy (no local DNS for providers).
      ITSM_EGRESS_PROXY: http://egress-proxy:3128
      ITSM_EGRESS_PROXY_AUTH_FILE: /run/secrets/egress_proxy_auth
      RUST_LOG: ${RUST_LOG:-info}
    secrets: [pg_password, itsm_keyring, egress_proxy_auth]
    volumes:
      - attachments:/var/lib/itsm/attachments
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy
      # Not a health dependency: without egress the API still serves (calls fail as unreachable).
      egress-proxy:
        condition: service_started
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  worker:
    # CP7b: outbox worker (Jira/Lark delivery, lease sweep, webhook prune) without the HTTP API.
    # Same image and configuration as api; claims use FOR UPDATE SKIP LOCKED with a lease, so
    # `docker compose up --scale worker=N` is safe. Migrations stay with the api service.
    image: itsm-uat-api:${ITSM_UAT_IMAGE_TAG:?ITSM_UAT_IMAGE_TAG wajib (git SHA kandidat)}
    command: ["worker"]
    environment:
      <<: *api-env
      ITSM_DB_MAX_CONNECTIONS: "${ITSM_WORKER_DB_MAX_CONNECTIONS:-4}"
      # Metrics carry the worker heartbeat for the healthcheck and ItsmOutboxWorkerStalled.
      ITSM_METRICS_BIND: 0.0.0.0:9464
    healthcheck:
      test: ["CMD", "/usr/local/bin/worker-healthcheck.sh"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 4
    secrets: [pg_password, itsm_keyring, egress_proxy_auth]
    networks: [backend]
    depends_on:
      # api migrates on start; the worker refuses to run against an unmigrated database.
      api:
        condition: service_healthy
      egress-proxy:
        condition: service_started
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  egress-proxy:
    # Squid 5.7 (deploy/egress/): CONNECT only, port 443 only, host allowlist, private/reserved
    # addresses refused after DNS, proxy basic auth, no TLS interception, no cache, JSON access log
    # without user, path or query. No ports published; reachable only from the backend network.
    build:
      context: ../..
      dockerfile: deploy/uat/Dockerfile
      target: egress
    image: itsm-uat-egress:${ITSM_UAT_IMAGE_TAG:?ITSM_UAT_IMAGE_TAG wajib (git SHA kandidat)}
    environment:
      ITSM_EGRESS_CLIENT_CIDRS: ${ITSM_UAT_BACKEND_SUBNET:-172.30.57.0/24}
      ITSM_EGRESS_DNS: "${ITSM_EGRESS_DNS:-1.1.1.1 8.8.8.8}"
    secrets: [egress_proxy_htpasswd]
    volumes:
      # Reviewed in git; a new host needs a security review (deploy/RUNBOOK-egress.md).
      - ../egress/allowlist.regex:/etc/squid/itsm/allowlist.regex:ro
    networks: [backend, egress]
    read_only: true
    tmpfs:
      - /run/squid:uid=13,gid=13,mode=0700
      - /tmp:uid=13,gid=13,mode=0700
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    restart: unless-stopped

  ingress:
    build:
      context: ../..
      dockerfile: deploy/uat/Dockerfile
      target: ingress
    image: itsm-uat-ingress:${ITSM_UAT_IMAGE_TAG:?ITSM_UAT_IMAGE_TAG wajib (git SHA kandidat)}
    environment:
      <<: *ingress-required
      ITSM_UAT_API_UPSTREAM: api:8080
    secrets: [ingress_basic_auth_hash]
    ports:
      - "${ITSM_UAT_HTTPS_BIND:-0.0.0.0:443}:443"
      - "${ITSM_UAT_HTTP_BIND:-0.0.0.0:80}:80"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks:
      edge: {}
      backend:
        ipv4_address: ${ITSM_UAT_INGRESS_IP:-172.30.57.10}
    depends_on:
      api:
        condition: service_healthy
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

networks:
  backend:
    internal: true
    ipam:
      config:
        - subnet: ${ITSM_UAT_BACKEND_SUBNET:-172.30.57.0/24}
  edge: {}
  clamav-updates: {}
  # Only egress-proxy joins this network; api, postgres and clamav never do.
  egress: {}

volumes:
  pgdata:
  attachments:
  clamav-db:
  caddy-data:
  caddy-config:

secrets:
  pg_password:
    file: ./secrets/pg_password
  ingress_basic_auth_hash:
    file: ./secrets/ingress_basic_auth_hash
  itsm_keyring:
    file: ./secrets/itsm_keyring
  egress_proxy_auth:
    file: ./secrets/egress_proxy_auth
  egress_proxy_htpasswd:
    file: ./secrets/egress_proxy_htpasswd
