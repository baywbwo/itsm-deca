name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: itsm_test
          POSTGRES_PASSWORD: itsm_test_dummy_only
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U itsm_test" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      # Dummy throwaway CI database only; never a real environment.
      DATABASE_URL: postgres://itsm_test:itsm_test_dummy_only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (pinned by rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: test
        run: cargo test --locked --all-targets
